name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check src tests
      - run: uvx ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rastro
          POSTGRES_PASSWORD: rastro
          POSTGRES_DB: rastro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rastro" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rastro:rastro@localhost:5432/rastro
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: uv run pytest
      - run: uv run pytest -m integration

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/deploy/Dockerfile
          push: false
