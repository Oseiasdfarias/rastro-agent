[project]
name = "rootcause-agent"
version = "0.1.0"
description = "From a customer complaint to the probable cause on the shop floor: an AI agent over synthetic SAP-format and CRM data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pypdf>=4.2",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "litellm>=1.50",
    "redis>=5.0",
    "langfuse>=2.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
rootcause = "rootcause.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootcause", "src/synthdata", "src/evals"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: needs DATABASE_URL (Postgres with pgvector)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
