name: rastro

include:
  - src/deploy/langfuse.compose.yml

x-app: &app
  build:
    context: .
    dockerfile: src/deploy/Dockerfile
  image: rastro-agent:dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://rastro:rastro@db:5432/rastro
    REDIS_URL: redis://redis:6379/0
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  extra_hosts:
    - host.docker.internal:host-gateway
  volumes:
    - ./data:/app/data
    - ./results:/app/results
    - hf-cache:/app/.cache/hf
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rastro
      POSTGRES_PASSWORD: rastro
      POSTGRES_DB: rastro
    ports:
      - "${DB_PORT:-55490}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rastro"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  api:
    <<: *app
    ports:
      - "8000:8000"

  seed:
    <<: *app
    profiles: [tools]
    command: ["python", "-m", "synthdata", "--seed", "7"]

  # Runs on the host network so it reaches an Ollama bound to 127.0.0.1 on the host.
  cli:
    <<: *app
    profiles: [tools]
    network_mode: host
    environment:
      DATABASE_URL: postgresql://rastro:rastro@localhost:${DB_PORT:-55490}/rastro
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
    extra_hosts: []
    entrypoint: ["rastro"]

  ollama:
    image: ollama/ollama:latest
    profiles: [local-llm]
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  hf-cache:
  ollama:
